<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">C</div><div><h1>チャンク学習アプリ</h1><div class="sub">B1からB2へ伸ばすための四択・音声・例文・解説つき英語チャンク帳</div></div></div><div class="metrics"><div class="metric" id="total">0 chunks</div><div class="metric" id="learned">学習済 0</div><div class="metric" id="accuracy">正答率 0%</div></div></header>
<main>
<section id="home" class="screen active"><div class="card"><div class="title">1. ジャンルを選ぶ</div><div class="grid" id="genreGrid"></div></div><div class="card"><div class="title">2. CEFRレベルを選ぶ</div><div class="grid" id="levelGrid"></div></div><div class="card"><div class="title">3. 学習を始める</div><p class="small">チャンク自体と、そのチャンクを使った自然な英文が表示されます。英文をタップすると音声が流れます。</p><div class="actions"><button class="btn primary" data-action="start">10問スタート</button><button class="btn soft" data-action="list">チャンク帳を見る</button></div></div></section>
<section id="quiz" class="screen"><div class="head"><div class="counter" id="qCounter">第1問 / 10問</div><div class="score"><span>○ <b id="ok">0</b></span><span>× <b id="ng">0</b></span></div></div><div class="bar"><div id="prog"></div></div><div class="question"><div class="label">CHUNK</div><div class="chunk tap" id="qChunk" data-action="speakChunk"></div><div class="label">EXAMPLE SENTENCE - TAP TO LISTEN</div><div class="sentence tap" id="qSentence" data-action="speakSentence"></div><div class="small">🔊 チャンクまたは英文をタップすると音声再生できます</div><div class="choices" id="choices"></div><div class="actions"><button class="btn white" data-action="speakSentence">英文を聞く</button><button class="btn soft" data-action="detail">解説を見る</button></div></div></section>
<section id="detail" class="screen"><div class="card detail"><div class="label">ANSWER & EXPLANATION</div><h2 id="dQuestion"></h2><div class="ja" id="dSentenceJa" style="font-size:18px;color:#475467"></div><div class="label">CHUNK MEANING</div><div class="meaning" id="dMeaning"></div><div class="small" id="dPattern" style="font-weight:900;margin-top:6px"></div><div class="exbox tap" data-action="speakConv"><div class="label">会話例</div><div class="en" id="dConv"></div><div class="ja" id="dConvJa"></div></div><div class="exbox tap" data-action="speakLong"><div class="label">少し長い例文</div><div class="en" id="dLong"></div><div class="ja" id="dLongJa"></div></div><p class="explain" id="dExplain"></p><div class="actions"><button class="btn primary" data-action="next">次の問題へ</button><button class="btn soft" data-action="speakDetail">解説を音声で聞く</button><button class="btn white" data-action="backQuiz">問題に戻る</button></div></div></section>
<section id="result" class="screen"><div class="card result"><div class="title">10問終了</div><div class="big" id="resultScore">0/10</div><p class="small" id="resultMsg"></p><div class="actions"><button class="btn primary" data-action="again">同じ条件でさらに10問</button><button class="btn white" data-action="home">問題選択に戻る</button><button class="btn soft" data-action="list">チャンク帳を見る</button></div></div></section>
<section id="list" class="screen"><div class="card"><input class="search" id="search" placeholder="チャンク・意味・ジャンルで検索"><div id="chunkList"></div></div></section>
</main>
<nav class="bottom"><button class="nav active" data-action="home">ホーム</button><button class="nav" data-action="quizNav">問題</button><button class="nav" data-action="list">チャンク帳</button></nav>
</div>

 for(i=0;i<nouns.length;i++){var n=nouns[i][0],jn=nouns[i][1];add('Let me check 〜.','〜を確認させてください','Let me check '+n+' first.','まず'+jn+'を確認させてください。','B1');add('I’m interested in 〜.','〜に興味があります','I’m interested in '+n+'.',jn+'に興味があります。','B1');add('I’m worried about 〜.','〜が心配です','I’m worried about '+n+'.',jn+'が心配です。','B1');add('Could you explain 〜?','〜を説明していただけますか','Could you explain '+n+' again?',jn+'をもう一度説明していただけますか。','B1');add('Let’s take a closer look at 〜.','〜をもう少し詳しく見ましょう','Let’s take a closer look at '+n+'.',jn+'をもう少し詳しく見ましょう。','B1+');}
 for(i=0;i<adjs.length;i++){var a=adjs[i][0],j=adjs[i][1];add('It seems 〜.','〜のようです','It seems '+a+' to me.','私には'+j+'なように思えます。','B1');add('It sounds 〜.','〜に聞こえます','It sounds '+a+'.',j+'に聞こえます。','B1');add('From my point of view, 〜.','私の観点では〜です','From my point of view, this is '+a+'.','私の観点では、これは'+j+'です。','B2');}
 var more=[['As far as I can tell, 〜.','私が分かる限り〜です','As far as I can tell, the plan is working.','私が分かる限り、その計画はうまくいっています。','B2'],['Compared with before, 〜.','以前と比べて〜です','Compared with before, my listening is better.','以前と比べて、リスニングが良くなっています。','B2'],['What happened was 〜.','何が起きたかというと〜です','What happened was I missed the train.','何が起きたかというと、電車に乗り遅れました。','B1+'],['That reminds me of 〜.','〜を思い出します','That reminds me of my first trip abroad.','それは初めての海外旅行を思い出させます。','B1+'],['The next step is to 〜.','次のステップは〜することです','The next step is to test the idea.','次のステップはそのアイデアを試すことです。','B1+'],['I’d rather 〜.','むしろ〜したいです','I’d rather talk about it tomorrow.','むしろ明日それについて話したいです。','B2'],['I’m supposed to 〜.','〜することになっています','I’m supposed to send the file today.','今日そのファイルを送ることになっています。','B1+'],['I’m likely to 〜.','〜しそうです','I’m likely to be late today.','今日は遅れそうです。','B2']];
 for(var r=0;r<45;r++){for(i=0;i<more.length;i++){add(more[i][0],more[i][1],more[i][2],more[i][3],more[i][4]);}}
 return arr.slice(0,650);
}
function renderButtons(){var g='',l='',i;for(i=0;i<genres.length;i++){g+='<button class="btn soft select" data-action="genre" data-value="'+genres[i]+'">'+genres[i]+'</button>'}for(i=0;i<levels.length;i++){l+='<button class="btn soft select" data-action="level" data-value="'+levels[i]+'">'+levels[i]+'</button>'}$('genreGrid').innerHTML=g;$('levelGrid').innerHTML=l;markSelects();}
function markSelects(){var bs=document.querySelectorAll('.select');for(var i=0;i<bs.length;i++){var b=bs[i],v=b.getAttribute('data-value');if(v===selectedGenre||v===selectedLevel)b.classList.add('active');else b.classList.remove('active');}}
function pool(){var a=[];for(var i=0;i<chunks.length;i++){var x=chunks[i];if((selectedGenre==='すべて'||x.genre===selectedGenre)&&(selectedLevel==='すべて'||x.level===selectedLevel))a.push(x)}return a;}
function startQuiz(){var p=pool();if(p.length<4){alert('この条件の問題が少ないため、条件を広げてください。');return}quiz=sample(p,10);idx=0;ok=0;ng=0;showQuestion();}
function showQuestion(){answered=false;current=quiz[idx];show('quiz');$('qCounter').innerHTML='第'+(idx+1)+'問 / '+quiz.length+'問';$('ok').innerHTML=ok;$('ng').innerHTML=ng;$('qChunk').innerHTML='<span>'+esc(current.pattern)+'</span>';$('qSentence').innerHTML=esc(current.question);$('prog').style.width=(idx/quiz.length*100)+'%';var wrong=[],i;for(i=0;i<chunks.length;i++){if(chunks[i].meaning!==current.meaning)wrong.push(chunks[i].meaning)}var opts=sample([current.meaning].concat(sample(wrong,3)),4);var html='';for(i=0;i<opts.length;i++){html+='<button class="choice" data-action="answer" data-value="'+esc(opts[i])+'">'+esc(opts[i])+'</button>'}$('choices').innerHTML=html;}
function answer(btn,val){if(answered)return;answered=true;var correct=val===current.meaning;if(correct){ok++;btn.classList.add('correct')}else{ng++;btn.classList.add('wrong');var cs=document.querySelectorAll('.choice');for(var i=0;i<cs.length;i++){if(cs[i].textContent===current.meaning)cs[i].classList.add('correct')}}save(correct);$('ok').innerHTML=ok;$('ng').innerHTML=ng;setTimeout(function(){showDetail(current)},450);}
function showDetail(item){detailItem=item;show('detail');$('dQuestion').innerHTML=esc(item.question);$('dSentenceJa').innerHTML=esc(item.sentenceJa);$('dMeaning').innerHTML=esc(item.meaning);$('dPattern').innerHTML='チャンク：'+esc(item.pattern);$('dConv').innerHTML=esc(item.conv);$('dConvJa').innerHTML=esc(item.convJa);$('dLong').innerHTML=esc(item.long);$('dLongJa').innerHTML=esc(item.longJa);$('dExplain').innerHTML=esc(item.explain);}
function nextQuestion(){if(idx>=quiz.length-1)showResult();else{idx++;showQuestion();}}
function showResult(){$('prog').style.width='100%';show('result');$('resultScore').innerHTML=ok+'/'+quiz.length;$('resultMsg').innerHTML=selectedGenre+'・'+selectedLevel+' の条件で10問完了しました。間違えたチャンクは、解説例文を3回音読すると定着しやすくなります。';}
function speak(t){try{if(!('speechSynthesis' in window)){alert('この端末では音声読み上げに対応していません。');return}window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/A:|B:/g,''));u.lang='en-US';u.rate=.88;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u)}catch(e){alert('音声再生を開始できませんでした。もう一度タップしてください。')}}
function speakDetail(){if(detailItem)speak(detailItem.pattern+'. '+detailItem.question+'. '+detailItem.conv+'. '+detailItem.long)}
function show(id){var ss=document.querySelectorAll('.screen'),i;for(i=0;i<ss.length;i++)ss[i].classList.remove('active');$(id).classList.add('active');var ns=document.querySelectorAll('.nav');for(i=0;i<ns.length;i++)ns[i].classList.remove('active');if(id==='home')ns[0].classList.add('active');else if(id==='list')ns[2].classList.add('active');else ns[1].classList.add('active');}
function renderList(){var q=($('search').value||'').toLowerCase(),html='',count=0;for(var i=0;i<chunks.length&&count<180;i++){var x=chunks[i],hay=(x.pattern+x.question+x.meaning+x.genre+x.level).toLowerCase();if(hay.indexOf(q)>-1){html+='<div class="listitem tap" data-action="item" data-id="'+x.id+'"><b>'+esc(x.pattern)+'</b><br><span>'+esc(x.question)+'</span><br><span>'+esc(x.meaning)+'</span><br><span class="tag">'+x.genre+'</span><span class="tag">'+x.level+'</span></div>';count++;}}$('chunkList').innerHTML=html;}
function getStats(){try{return JSON.parse(localStorage.getItem('chunkStats5')||'{"done":0,"ok":0}')}catch(e){return {done:0,ok:0}}}
function setStats(s){try{localStorage.setItem('chunkStats5',JSON.stringify(s))}catch(e){}}
function save(correct){var s=getStats();s.done++;if(correct)s.ok++;setStats(s);updateStats();}
function updateStats(){var s=getStats();$('learned').innerHTML='学習済 '+s.done;$('accuracy').innerHTML='正答率 '+(s.done?Math.round(s.ok/s.done*100):0)+'%';}
function findById(id){for(var i=0;i<chunks.length;i++){if(String(chunks[i].id)===String(id))return chunks[i]}return null;}
function handle(e){var el=e.target;while(el&&el!==document&&!el.getAttribute('data-action'))el=el.parentNode;if(!el||el===document)return;var a=el.getAttribute('data-action');
 if(a==='genre'){selectedGenre=el.getAttribute('data-value');markSelects();return}
 if(a==='level'){selectedLevel=el.getAttribute('data-value');markSelects();return}
 if(a==='start'||a==='again'){startQuiz();return}
 if(a==='home'){show('home');return}
 if(a==='list'){show('list');renderList();return}
 if(a==='quizNav'){if(current)show('quiz');else startQuiz();return}
 if(a==='speakChunk'){if(current)speak(current.pattern);return}
 if(a==='speakSentence'){if(current)speak(current.question);return}
 if(a==='detail'){if(current)showDetail(current);return}
 if(a==='answer'){answer(el,el.getAttribute('data-value'));return}
 if(a==='next'){nextQuestion();return}
 if(a==='backQuiz'){show('quiz');return}
 if(a==='speakConv'){if(detailItem)speak(detailItem.conv);return}
 if(a==='speakLong'){if(detailItem)speak(detailItem.long);return}
 if(a==='speakDetail'){speakDetail();return}
 if(a==='item'){var it=findById(el.getAttribute('data-id'));if(it)showDetail(it);return}
}
function init(){chunks=buildData();$('total').innerHTML=chunks.length+' chunks';renderButtons();updateStats();document.body.addEventListener('click',handle,false);$('search').addEventListener('input',renderList,false);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,false);else init();
})();
</script>
</body>
